<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SYS_ID // IP_TRACE</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background-color: #000; color: #33ff66; font-family: 'Courier New', Courier, monospace; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; position: relative; }
#matrix-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
.terminal { position: relative; z-index: 1; background-color: rgba(0, 5, 0, 0.85); border: 1px solid #33ff66; box-shadow: 0 0 20px rgba(51, 255, 102, 0.3), inset 0 0 10px rgba(51, 255, 102, 0.1); padding: 30px 40px; border-radius: 4px; max-width: 500px; width: 100%; }
.header { font-size: 0.8rem; color: #00aa44; margin-bottom: 15px; border-bottom: 1px dashed #33ff66; padding-bottom: 5px; }
.prompt { font-size: 1rem; margin-bottom: 10px; }
.ip-display { font-size: 1.5rem; font-weight: bold; color: #fff; text-shadow: 0 0 8px #33ff66; letter-spacing: 2px; }
.cursor { display: inline-block; width: 10px; height: 1.2rem; background-color: #33ff66; vertical-align: middle; animation: blink 1s step-end infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
</style>
</head>
<body>
<canvas id="matrix-canvas"></canvas>
<div class="terminal">
<div class="header">ROOT@MATRIX:~# ip a</div>
<div class="prompt">> TARGET_IP_IDENTIFIED:</div>
<div class="ip-display" id="ip-target">SCANNING<span class="cursor"></span></div>
</div>
<script>
const canvas = document.getElementById('matrix-canvas');
const ctx = canvas.getContext('2d');
function resizeCanvas() {
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
columns = Math.floor(canvas.width / fontSize);
drops = Array(columns).fill(0).map(() => Math.random() * -canvas.height / fontSize);
}
// Authentic Matrix code features: Reversed half-width Katakana, numerals, and select symbols
const letters = 'ｦｱｳｴｵｶｷｹｺｻｼｽｾｿﾀﾂﾃﾅﾆﾇﾈﾊﾋﾎﾏﾐﾑﾒﾓﾔﾕﾗﾘﾜ012345789Z:."=*+-<>¦';
const fontSize = 14;
let columns;
let drops;
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
function drawMatrix() {
// Trail effect: trails are long and fade gently
ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
ctx.fillRect(0, 0, canvas.width, canvas.height);
// Set the correct code font style
ctx.font = 'bold ' + fontSize + 'px monospace';
for (let i = 0; i < drops.length; i++) {
// Generate random lore character
const text = letters.charAt(Math.floor(Math.random() * letters.length));
const x = i * fontSize;
const y = drops[i] * fontSize;
// Lore Accuracy: Mirror the characters horizontally to look backwards (coded view)
ctx.save();
ctx.translate(x + fontSize / 2, y - fontSize / 2);
ctx.scale(-1, 1);
// Lore Accuracy: The leading character of each stream must be bright white
ctx.fillStyle = '#ffffff';
ctx.shadowColor = '#33ff66';
ctx.shadowBlur = 8;
ctx.fillText(text, -fontSize / 2, fontSize / 2);
ctx.restore();
// Subsequent steps in the loop color characters behind the leader a rich green
// This naturally creates the iconic bright head with a fading body
if (drops[i] > 1) {
ctx.save();
ctx.translate(x + fontSize / 2, (drops[i] - 1) * fontSize - fontSize / 2);
ctx.scale(-1, 1);
ctx.fillStyle = '#33ff66';
ctx.shadowBlur = 2;
ctx.fillText(letters.charAt(Math.floor(Math.random() * letters.length)), -fontSize / 2, fontSize / 2);
ctx.restore();
}
// Wrap streams independently back to the top once they exit the screen
if (y > canvas.height && Math.random() > 0.98) {
drops[i] = 0;
}
// Speed variation simulation: uniform steps per frame, staggered restarts
drops[i]++;
}
}
// The digital rain falls rapidly: ~30ms interval brings it closer to film speed
setInterval(drawMatrix, 33);
function getIP(json) {
document.getElementById('ip-target').innerHTML = json.ip + '<span class="cursor"></span>';
}
</script>
<script type="application/javascript" src="https://api.ipify.org?format=jsonp&callback=getIP"></script>
</body>
</html>
